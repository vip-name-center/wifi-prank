<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free High-Speed Wi-Fi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* ফুল স্ক্রিন ইমেজ স্টাইল */
        .fullscreen-img {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* ছবি যেন স্ক্রিন জুড়ে সুন্দরভাবে ফিট হয় */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* ব্রাউজার অটো-প্লে ব্লক করলে ম্যানুয়ালি ক্লিক করার বাটন */
        .play-btn {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- ফুল স্ক্রিন ছবি দেখানোর ট্যাগ -->
    <img id="prank-image" class="fullscreen-img" src="" alt="Loading...">

    <!-- অডিও ট্যাগ -->
    <audio id="prank-audio" preload="auto"></audio>

    <!-- অটো-সাউন্ড না বাজলে এই বাটন দেখাবে -->
    <button id="fallback-btn" class="play-btn" style="display: none;" onclick="playAudioManually()">ওয়াইফাই কানেক্ট করতে ট্যাপ করুন</button>

    <script>
        // আপনার দেওয়া ছবি এবং অডিও ফাইলের নাম দিয়ে ডাটা লিস্ট তৈরি করা হলো
        const prankData = [
            {
                image: "hhjj.jpg",
                audio: "ikk.m4a"
            },
            {
                image: "ggh.jpg",
                audio: "hjjj.mp3"
            }
        ];

        // র‍্যান্ডমলি যেকোনো একটি সেট সিলেক্ট করা
        const randomIndex = Math.floor(Math.random() * prankData.length);
        const selectedPrank = prankData[randomIndex];

        const imgElement = document.getElementById("prank-image");
        const audioElement = document.getElementById("prank-audio");
        const fallbackBtn = document.getElementById("fallback-btn");

        // ছবি এবং অডিওর সোর্স সেট করা
        imgElement.src = selectedPrank.image;
        audioElement.src = selectedPrank.audio;

        // অটো ভয়েস বা অডিও প্লে করার চেষ্টা
        window.addEventListener("DOMContentLoaded", () => {
            let playPromise = audioElement.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // সফলভাবে অটো প্লে হলে
                }).catch(error => {
                    // ব্রাউজার পলিসির কারণে ব্লক হলে বাটন শো করবে
                    fallbackBtn.style.display = "block";
                });
            }
        });

        // ম্যানুয়ালি ক্লিক করলে অডিও চালুর ফাংশন
        function playAudioManually() {
            audioElement.play();
            fallbackBtn.style.display = "none";
        }
    </script>

</body>
</html>
